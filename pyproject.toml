[project]
name = "os2forms-polling-service"
version = "0.1.0"
description = "Generic polling service: reads jobs from SQL Server, polls OS2forms submissions, delivers to configurable destinations (Automation Server first)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "sqlmodel>=0.0.22",
    "pyodbc>=5.1",
    "httpx>=0.27",
    "structlog>=24.4",
    "tenacity>=9.0",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
# Dev smoke script: env setup precedes imports (E402); test secrets/long fixtures are fine.
"scripts/**" = ["S", "E402", "E501", "I001"]
# FastAPI idiom: Depends()/Query() in argument defaults.
"app/api/**" = ["B008"]
# token_type = "bearer" is an OAuth constant, not a secret.
"app/api/schemas.py" = ["B008", "S105"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
